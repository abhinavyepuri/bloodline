services:
  # PostgreSQL with PostGIS Spatial Extensions
  db:
    image: postgis/postgis:16-3.4
    container_name: smartblood_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartblood_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for Distributed Concurrency Locks & Real-time PubSub
  redis:
    image: redis:7.2-alpine
    container_name: smartblood_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartblood_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/smartblood_db
      REDIS_URL: redis://redis:6379/0
      DEBUG: "True"
      ENVIRONMENT: development
      # Comma-separated. Must list the origins the *browser* uses, so both the Vite dev
      # server (5173) and the served frontend container (8080) are included.
      BACKEND_CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080"
      # SECRET_KEY is intentionally left at its development default: the app refuses to
      # start with it once ENVIRONMENT is anything other than development/dev/test.
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    # The image ships no schema state, so migrations are applied on every start.
    # `alembic upgrade head` is idempotent. Seeding is a separate, deliberate step:
    #   docker compose exec backend python -m app.seed
    command: >
      sh -c "python -m app.init_db &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # React Frontend, built as a static bundle and served by nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Resolved by the browser on the host, not by the container — hence localhost
        # rather than the compose service name `backend`.
        VITE_API_BASE_URL: http://localhost:8000
    container_name: smartblood_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
  redis_data:
